# The config the live suites run against, copied to /root/cline.yaml inside the
# node that has cline installed. `make test-install` does that.
#
# Two single-node replica sets:
#
#   node1  rsHot   the fast tier
#   node0  rsCold  the archive, and where cline and the suites run
#
# Minute-scale durations so a full lifecycle runs in minutes. Nothing in
# Thermocline assumes days: older_than 40m behaves exactly like older_than 90d.
#
# The addresses are overridden at install time, so the ones here are only the
# defaults for the documented layout.

hot:
  uri: "mongodb://dba:secret@172.24.0.6:27017,172.24.0.7:27017,172.24.0.5:27017/?replicaSet=rsHot&authSource=admin"

cold:
  uri: "mongodb://dba:secret@172.24.0.4:27017,172.24.0.2:27017,172.24.0.3:27017/?replicaSet=rsCold&authSource=admin"

log:
  file: ""

feeder:
  id: "test"
  # Every collection the suites tier. A collection missing from this list is not
  # tiered at all, and the router correctly ignores it, so a test written against
  # one proves nothing.
  namespaces:
    - "shop.orders"
    # test/store: the order log a shop appends to for ever, tiered alongside
    # the orders themselves. The catalogue and the customers are deliberately
    # NOT tiered: no shop archives what it is still selling, and a router that
    # is only ever asked about tiered collections is not being tested the way
    # an application uses it.
    - "shop.order_events"
    - "shop.tprobe"
    - "shop.tacct"
    # testrouter.sh: a tiered collection deliberately left off the fast tier, to
    # check the router still names it in the catalog and reads it.
    - "shop.tcatalog"
    # testrouter.sh: the same shape again, for the commands that describe a
    # collection rather than read it. Its own collection because nothing may
    # have listed it: a listing repairs the fast tier and would answer the
    # question before it is asked.
    - "shop.tcatalog2"
    # testindexes.sh: an adopted collection whose indexes carry options the copy
    # has to bring across whole, a text index and a wildcard one.
    # testkeys.sh: the collection the reserved field names are checked on. It is
    # tiered because that is the point: those marks mean nothing in a collection
    # nothing mirrors, and the guard deliberately leaves those alone.
    # testrouter.sh: the collection whose archive copy is capped out of band, to
    # check what a router already running says about it. The feeder refuses to
    # start against this pair, which is why the suite starts its own router and
    # not a feeder.
    # testops.sh: a GridFS bucket, because a collection of file chunks that only
    # grows and is read rarely is exactly what this tiers, and filemd5 hashes
    # one file's chunks on whichever tier runs it.
    - "shop.fs.chunks"
    - "shop.fs.files"
    - "shop.trcapped"
    - "shop.tkreserved"
    - "shop.tidxtext"
    # testindexes.sh: a collection deliberately made different on the two tiers,
    # to check the router says so.
    - "shop.tdrift"
    # testddl.sh: a tiered name of the shape queryable encryption keeps its own
    # state under. Nothing ever creates it: the point is that the router refuses
    # every way of bringing one into being, because the feeder stops mirroring
    # for every namespace the moment one is written to. If it ever does exist,
    # the feeder here will refuse to start and say so, which is the loud end of
    # the same rule.
    - "shop.enxcol_probe"
    # testddl.sh: the collection a TTL index is refused on.
    - "shop.tddlttl"
    # testddl.sh: the same, for a TTL index that arrives by the other door,
    # straight at the fast tier, which the router cannot refuse and says so.
    - "shop.tddlttloob"
    # testtypes.sh: a collection mirrored normally and then converted to capped
    # out of band, which the kind check had already said yes about.
    - "shop.tcapconv"
    # testtypes.sh: the control for that recheck, an ordinary collection whose
    # own deletes are unannounced and must not stop anything.
    - "shop.tdelplain"
    # testddl.sh: the collection that may not be made capped or time series.
    - "shop.tddlcap"
    - "shop.tddlcap2"
    # testsingle.sh: the collection a sorted findAndModify picks from.
    - "shop.tssort"
    # testquery.sh: aged by createdAt, so a bound on another date field must not
    # be read as covering the completeness claim.
    - "shop.tqbound"
    # testquery.sh: aged by createdAt, with one document in the archive whose
    # createdAt is a Timestamp rather than a date. A sort orders across types
    # where a range predicate does not, so it belongs first.
    - "shop.tqtype"
    # a probe collection holding a document of every BSON type in the field it
    # is aged by, compared against the archive question by question.
    - "shop.tmenag"
    # testbson.sh: dates only, and a fast tier holding one document older than
    # its own claim, which is what makes the newest-first proof fail honestly.
    - "shop.tmenag2"
    # a probe namespace for measuring what mirroring costs under load.
    - "shop.tfeed"
    # testindexes.sh: dropped through the router and brought back, to check the
    # indexer is told rather than left to notice.
    - "shop.tidxdrop"
    # testwarm.sh: aged by a date field some of its documents do not have.
    - "shop.twunaged"
    # testquery.sh: the collection a deeply nested $lookup reads, to check the
    # scope walk does not fail open at its depth limit.
    - "shop.tnesttarget"
    # testops.sh: the collection dbHash is asked about, whole and short.
    - "shop.tdbhash"
    # testkeys.sh: the collection a second router has to notice a new unique
    # index on, without being restarted.
    - "shop.tkddl2"
    # testkeys.sh: the collection whose unique index goes away underneath the
    # router, once by dropping the index and once by dropping the whole
    # collection, both out of band so nothing forwards the DDL.
    - "shop.tkgone"
    # testkeys.sh: an adoption, which is the archive arriving with its documents
    # and its unique index already on it and nothing having claimed any of their
    # keys. Its own collection, because the section restarts routers and counts
    # what they say about this namespace alone.
    - "shop.tkadopt"
    # testevict.sh: the collection the restored-archive section mirrors, updates
    # and then restores to an older backup underneath a live fast tier.
    - "shop.trestore"
    # testwarm.sh: the two collections its derived configs put a warmer rule on.
    # They are listed here because a rule for a namespace the feeder does not
    # tier is refused now, and rightly: nothing would mirror it, so the router
    # would answer it from the fast tier alone while the warmer copied the
    # archive's cutover snapshot up. The suite seeds the archive and warms, which
    # is the adoption shape, and this is what makes that configuration a legal
    # one.
    - "shop.tdated"
    - "shop.tshrink"
    # testevict.sh: the same, on the removing side.
    - "shop.tevunaged"
    # testfresh.sh: read while the feeder is stopped, so every read copies up.
    - "shop.tfstopped"
    # testfresh.sh: eight deletes with the feeder stopped, checking that every
    # document the archive hands back was one the router counted. Its own
    # collection because the section stops and starts the feeder around each
    # one, and tprobe is read by the sections either side of it.
    - "shop.tfdel"
    # testevict.sh: a claim narrowed and acted on in the same sweep.
    - "shop.tevclaim"
    # testevict.sh: a cursor held open while a sweep takes its documents off the
    # fast tier. Aged by `when`, so a rule can address it.
    - "shop.tevcursor"
    # testevict.sh: the same question asked of an aggregation, which is judged
    # before it runs rather than on the way back. Its own collection, so the
    # claim and the residency the section before it leaves behind decide
    # nothing here.
    - "shop.tevaggcur"
    # And the same one level up. catdb holds nothing else, so the section can
    # drop the whole database on the fast tier without reaching a collection
    # another suite is using.
    - "catdb.tcatdb"
    # testops.sh: what dbStats says about a database whose tiered collections
    # the fast tier holds part of, and one it holds none of. In catdb for the
    # same reason: dbStats totals a whole database, so the check is only
    # deterministic in one nothing else writes to.
    - "catdb.tdbstats"
    - "catdb.tdbstats2"
    # testkeys.sh, one collection per section: the router caches a namespace's
    # unique indexes for a minute, so a name reused with a different index is
    # still enforced under the old one.
    - "shop.tkupd"
    # testkeys.sh: a statement whose collation is the only reason its filter
    # matches, which is what decides the keys the registry claims for it.
    - "shop.tkupdcoll"
    - "shop.tkups"
    # And one for what a unique index the archive lacks costs the write path,
    # which only a tiered namespace is told about.
    - "shop.tkucost"
    # testevict.sh: the collection whose eviction announcements are driven
    # negative by hand, because that state destroys documents and outlives
    # whatever produced it.
    - "shop.tevneg"
    - "shop.tkfree"
    # testkeys.sh: the key a deleted document held, which is the other way a
    # value stops being held and the one a cancellation reaches.
    - "shop.tkdel"
    - "shop.tkcomp"
    - "shop.tknull"
    - "shop.tklate"
    # testkeys.sh: the same number written as a long and as a double. MongoDB
    # compares numbers across int, long and double, so both are one key.
    - "shop.tknum"
    # testkeys.sh: a unique index with a case-insensitive collation, where two
    # spellings are one key and their bytes are not.
    - "shop.tkcoll"
    - "shop.tkspar"
    - "shop.tkpart"
    # testkeys.sh: collation crossed with a partial filter, which is where the
    # two rules meet and where only one of them was being applied.
    - "shop.tkcollpart"
    - "shop.tkddl"
    - "shop.tkeval"
    - "shop.tkeval2"
    # testkeys.sh: a unique index on a field that holds an array, which is
    # multikey, and one on a path that crosses an array. Their own collections
    # because the router caches a namespace's unique indexes.
    - "shop.tkarr"
    - "shop.tkarrp"
    - "shop.rollup"
    - "shop.merged"
    # testaggwrite.sh: the input and the target of an $out whose reading half
    # joins a collection of its own
    - "shop.joinsrc"
    - "shop.joinout"
    # testaggwrite.sh: the same reading half, reaching the joined collection
    # through a view. tovsrc is whole and claimed, so nothing about it can
    # refuse the pipeline, and tovjoin is what the fast tier is short of.
    - "shop.tovsrc"
    - "shop.tovjoin"
    - "shop.tres"
    # testlife.sh: a collection the fast tier validates and the archive does
    # not, which is what every collection looks like after an operator adds a
    # validator to one that was already being tiered.
    - "shop.tval"
    - "shop.tttl"
    - "shop.tdrop"
    - "shop.tbig"
    # testlife.sh: the collection the archive has a unique index on and the
    # fast tier does not, which is what the feeder cannot mirror.
    - "shop.tdup"
    # testlife.sh: documents already on the fast tier when the feeder first
    # starts, which mirroring will never carry into the archive.
    - "shop.tstrand"
    - "shop.tconc"
    - "shop.tbulk"
    - "shop.bench"
    - "shop.benchuniq"
    # testtxn.sh, one collection per section for the same index-cache reason.
    - "shop.ttxa"
    - "shop.ttxb"
    - "shop.ttxc"
    - "shop.ttxd"
    - "shop.ttxe"
    - "shop.ttxf"
    - "shop.ttxg"
    - "shop.ttxh"
    - "shop.ttxi"
    - "shop.ttxj"
    # testtxn.sh: a transaction whose read carries its own collation, where the
    # copy-up that makes the fast tier able to answer has to use the same one.
    - "shop.ttxk"
    # testconcerns.sh
    - "shop.tconc2"
    - "shop.tconc2u"
    - "shop.tconc2z"
    - "shop.zprobe"
    # testsingle.sh: an _id both tiers hold against one only the archive holds,
    # which is the difference between a refusal mongod owes the client and one
    # this router owes it. Its own collection because the section seeds the two
    # tiers differently on purpose.
    - "shop.tsdup"
    # testall.sh: a completeness claim checked against what the two tiers hold,
    # which is what preflight does after a restore. Its own collection because
    # the section takes documents off the fast tier out of band to make the
    # claim false, and any other section reading it would see a short answer.
    - "shop.zclaim"
    # testtypes.sh
    - "shop.tcap"
    - "shop.tts"
    # testauth.sh
    - "shop.tauth"
    # testauthterm.sh, its own collection so it cannot inherit testauth.sh's
    # archived documents and count them into every answer.
    - "shop.tatrm"
    # testreadprefterm.sh
    - "shop.trpterm"
    # testecho.sh
    - "shop.techo"
    # testmerge.sh: tmref is deliberately NOT here, it is the untiered reference
    - "shop.tmrg"
    # testkeys.sh: a $merge writes documents, so it claims their unique keys.
    # Its own collection, because the router caches a namespace's unique indexes
    # and a name shared with another section is enforced under the wrong one.
    - "shop.tkmrg"
    # testkeys.sh again, for a $merge matching on a numeric field. A separate
    # collection for the same reason: its unique index is on another field.
    - "shop.tkmrg2"
    # testkeys.sh: pruning the registry, which needs its own collection because
    # the check counts the claims for exactly one namespace.
    - "shop.tkprune"
    # testchaos.sh: an index build while a fast tier member is away. Its own
    # collection, because the check is that the router's startup build finishes
    # and any other suite's leftovers there would decide it.
    - "shop.tchaosidx"
    # testmerge.sh again, in another database, because $merge resolves its
    # target through `into: {db, coll}` and that resolution is what a guard
    # reading only the collection name would get wrong. tmrefx is the untiered
    # reference and is deliberately not listed.
    - "wh.tmrgx"
    # testdaemonmetrics.sh
    - "shop.tdmet"
    # testretry.sh
    - "shop.tretry"
    # testpool.sh
    - "shop.tpool"
    # testfailover.sh. tfocu is deliberately not here: it is the untiered
    # collection whose cursor the router only forwards.
    - "shop.tfail"
    - "shop.tfoc"
    - "shop.tarchdrop"
    - "shop.tlostarch"
    - "shop.tidxsay"
    - "shop.tgeo"
    - "shop.tqgeo"
    - "shop.tfirst"
    - "shop.tns.dotted"
    - "shop.tevdim"
    - "shop.tkrefused"
    # And its twin, where the duplicate is resolved by deleting the document
    # rather than by editing it, which is the other thing an operator does.
    - "shop.tkrefdel"
    - "shop.tnat"
    - "shop.tpre"
    - "shop.tseq"
    - "shop.tkregistry"
    # testindexes.sh
    - "shop.tidx"
    # testindexes.sh again, for what `cline indexes` reports and what it
    # refuses to suggest creating on the archive.
    - "shop.tidxrep"
    # testindexes.sh again, for the collection an adoption starts with: it
    # exists on the archive with the application's indexes, the fast tier has
    # never held it, and nothing warms it or reads it, so the application's own
    # first write is what creates it on the fast tier.
    - "shop.tidxadopt"
    # testindexes.sh again, for the collection options an adoption carries that
    # documents do not: a default collation and a validator, both of which live
    # only on the archive until something puts them on the fast tier.
    - "shop.tidxopt"
    # testwarm.sh: a collection whose _id values are not ObjectIds, which is
    # what a rule reading a document's age from the _id timestamp cannot
    # address at all.
    - "shop.tintid"
    # testwarm.sh: the collection a client watches while the warmer moves it,
    # to check a warm is not delivered as an application insert. Its own
    # collection so no other section's copy-up lands in the window it reads.
    - "shop.twstream"
    # testexplain.sh
    - "shop.texpl"
    # testunack.sh, the writes that ask for no acknowledgement
    - "shop.tunku"
    - "shop.tunki"
    - "shop.tunkm"
    # testunack.sh: the single-document write, which is the statement
    # guardMultiWrite skips and interceptWrite puts right on the reply. One
    # collection for the update and one for the delete, because each section
    # takes documents off the fast tier behind the feeder and a shared
    # collection would decide the other's fixture.
    - "shop.tunk1"
    - "shop.tunk2"
    # testunack.sh: findAndModify, which is a third dispatch again: its repair
    # is interceptFindAndModify and its sort is judged by guardSortedFindAndModify.
    - "shop.tunk3"
    # testunack.sh: an unacknowledged dropIndexes, which is refused rather than
    # guarded. Its own collection because the section carries a unique index on
    # both tiers and the checks read exactly which indexes each one has.
    - "shop.tunkx"
    # testunack.sh: an unacknowledged create. tunkc carries a collation, which
    # is the option that cannot be added afterwards; tunkb is the bare create
    # that must still go through, and needs its own collection because the
    # check is that it was created at all.
    - "shop.tunkc"
    - "shop.tunkb"
    # testupsert.sh
    - "shop.tups"
    - "shop.tupsf"
    # testconform.sh: tcref is deliberately NOT here, it is the untiered reference
    - "shop.tcon"
    # testconform.sh: a collection whose collation is its own default rather
    # than a field in the command, which is the half of the rule nothing sent.
    - "shop.tcondef"
    # testconform.sh: the same collation question asked of a sort and of a
    # $group, both of which the archive answers.
    - "shop.tconsort"
    # testfuzz.sh: same arrangement, tcfuzz is tiered and tcref is the reference
    - "shop.tcfuzz"
    # testfuzz.sh: the second pair, so a generated join can name a collection
    # other than the one it runs against. tcref2 is the untiered reference and
    # is deliberately NOT here.
    - "shop.tcfuzz2"
    # fuzz.js: the target an $out or a $merge writes into. Tiered, because
    # writing into a tiered collection is the half of that path the archive
    # reads for, and the reference target beside it is untiered.
    - "shop.tcfuzzout"
    # testtxn.sh: a transaction updating one document the fast tier holds and one
    # only the archive has, read back the instant it commits. ttxref is the
    # untiered reference and is deliberately NOT here.
    - "shop.ttxmul"
    # testddl.sh: a collection created through the router after the fast tier
    # lost it out of band
    - "shop.tdcreate"
    # testddl.sh: a collection the fast tier loses out of band, carrying a
    # default collation and a unique index the archive has and the recreated
    # copy would not.
    - "shop.tidxoob"
    # testkeys.sh: a collated unique index whose match on the archive is created
    # after the router has already asked about it
    - "shop.tkcoll2"
    # testkeys.sh: collMod as the other door into a unique index. The section
    # needs the archive to hold a live duplicate, so the namespace has to be
    # one the feeder mirrors; without this entry the fixture mirrored nothing
    # and every check read as the guard letting a conversion through.
    - "shop.tkcollmod"
    # testsingle.sh
    - "shop.tsdel"
    - "shop.tsupd"
    - "shop.tsins"
    # testquery.sh
    - "shop.tqcoll"
    # testquery.sh: applyOps, which writes straight into a collection and so is
    # refused for a tiered one. Its own collection because the section leaves an
    # archived document on purpose to see whether it survives.
    - "shop.tqapply"
    - "shop.tqtext"
    - "shop.tqview"
    # testquery.sh: a view whose own pipeline joins a second tiered collection.
    # tqvb is the collection the view is defined on and is claimed complete;
    # tqvj is the one it joins, and the fast tier deliberately holds part of it.
    - "shop.tqvb"
    - "shop.tqvj"
    # testquery.sh: dropped through the router, to check the archive keeps its
    # documents while a dropped view does not survive there.
    - "shop.tqdroplife"
    # testbulk.sh
    - "shop.tbwu"
    - "shop.tbwm"
    # testbulk.sh: an _id only the archive holds, against a bulkWrite insert of
    # the same _id. Its own collection because the section leaves the fast tier
    # without the document on purpose.
    - "shop.tbwi"
    # testchange.sh
    - "shop.tcs"
    # testchange.sh: a promotion read after the application deleted the
    # document. Its own collection, because the section drops it and the one
    # above watches the whole database.
    - "shop.tcs2"
    # testchange.sh: a stream resumed from a stored position, whose events
    # arrive in the aggregate's own first batch rather than in a getMore. Its
    # own collection so that no other section's copy-up lands in the window it
    # reads.
    - "shop.tcs3"
    # testchange.sh: a collection with a unique index, so writes to it make the
    # router claim keys in its own registry on the fast tier. Its own
    # collection because that registry is what the section is watching for.
    - "shop.tcs4"
    # testchange.sh: the archive holds it with its indexes and the fast tier
    # holds none of it, so the first copy-up makes the router create the
    # collection there and build the archive's indexes on it. Its own
    # collection because the section needs a namespace no other section has
    # already had the router repair.
    - "shop.tcs5"
    # testchange.sh: pre-images. The archive holds the collection with
    # changeStreamPreAndPostImages on and the fast tier holds none of it, so a
    # client watching with fullDocumentBeforeChange gets its pre-image only if
    # the option travelled with the copy-up's create. Its own collection,
    # because turning that option on is a property of the collection and every
    # other section would then be watching one that has it.
    - "shop.tcs6"
    # testcache.sh
    - "shop.tcache"
    # testcache.sh again, for the cache across an adoption: the archive holds
    # the collection and the fast tier has never held any of it.
    - "shop.tcadopt"
    # testddl.sh. tddl2 is the target of the rename, and it has to be tiered
    # too: a rename into a name the namespace list does not carry is refused,
    # because it would stop the tiering with nothing saying so.
    - "shop.tddl"
    - "shop.tddl2"
    # traffic.sh, which drives the dashboard
    - "shop.tdash"
    - "shop.tdashu"
  checkpoint_every: 1s
  batch_size: 500
  max_await: 20ms
  unannounced_deletes: tombstone

evictor:
  feeder_id: "test"
  rate: 500
  batch_size: 100
  max_feeder_lag: 30s
  rules:
    - ns: "shop.orders"
      older_than: 40m
    - ns: "shop.tcs"
      older_than: 40m
    # testevict.sh: the collection a cursor is held open over while a sweep
    # takes its documents off the fast tier.
    - ns: "shop.tevneg"
      older_than: 40m
    - ns: "shop.tevcursor"
      older_than: 40m
      date_field: "when"
    # testevict.sh: the aggregation half of the same section.
    - ns: "shop.tevaggcur"
      older_than: 40m
      date_field: "when"
    # testquery.sh: aged by a date field rather than by the _id, so a bound on
    # some other date is a bound in a different dimension.
    - ns: "shop.tqbound"
      older_than: 40m
      date_field: "createdAt"
    - ns: "shop.tqtype"
      older_than: 40m
      date_field: "createdAt"
    - ns: "shop.tmenag"
      older_than: 40m
      date_field: "createdAt"
    - ns: "shop.tmenag2"
      older_than: 40m
      date_field: "createdAt"
  backoff:
    max_replication_lag: 10s
    max_cache_dirty: 0.05
    min_write_tickets_free: 0.25
    # A cluster built minutes ago has minutes of oplog. The 24h production
    # default blocks eviction outright, which looks like a hang and is the first
    # thing to trip anyone testing this.
    min_oplog_window: 1m

warmer:
  rate: 500
  batch_size: 50
  residency: 5m
  rules:
    - ns: "shop.orders"
      back: 40m
    # Deliberately with no date_field, against a collection keyed by integers.
    # testwarm.sh checks that this is refused rather than obeyed.
    - ns: "shop.tintid"
      back: 40m
    # testcache.sh: the collection an adoption starts with, warmed so the tier
    # that answers changes underneath the application while the cache is on.
    - ns: "shop.tcadopt"
      back: 40m
    - ns: "shop.tqbound"
      back: 40m
      date_field: "createdAt"
    - ns: "shop.tqtype"
      back: 40m
      date_field: "createdAt"
    - ns: "shop.tmenag"
      back: 40m
      date_field: "createdAt"
    - ns: "shop.tmenag2"
      back: 40m
      date_field: "createdAt"
  backoff:
    max_replication_lag: 10s
    max_cache_dirty: 0.05
    min_write_tickets_free: 0.25
    min_oplog_window: 1m

router:
  listen: "0.0.0.0:27100"
  # 27100-27103 and 27177 are taken by routers the suites start, including one
  # on 27101 that testrouter.sh points a client at. A dashboard bound there
  # fights the router for the port and one of them loses.
  dashboard: "0.0.0.0:27110"
  completeness: archive
  residency: 5m
