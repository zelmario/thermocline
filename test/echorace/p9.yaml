# item 9 of docs/production-readiness.md: see test/echorace. The second router
# is this file with its ports moved to 27860 and 27870; echorace.sh derives it.
hot:
  uri: "mongodb://dba:secret@172.24.0.5:27017,172.24.0.6:27017,172.24.0.7:27017/?replicaSet=rsHot&authSource=admin"
cold:
  uri: "mongodb://dba:secret@172.24.0.2:27017,172.24.0.3:27017,172.24.0.4:27017/?replicaSet=rsCold&authSource=admin"

log:
  file: ""

meta:
  db: "_thermocline_p9"

feeder:
  id: "p9"
  namespaces:
    - "probe9.docs"
  checkpoint_every: 1s
  batch_size: 500
  max_await: 20ms
  unannounced_deletes: tombstone

evictor:
  feeder_id: "p9"
  rate: 2000
  batch_size: 200
  max_feeder_lag: 30s
  rules:
    - ns: "probe9.docs"
      older_than: 1h
  backoff:
    min_oplog_window: 1m

router:
  # Clear of every port the suites and the pilot use.
  listen: "0.0.0.0:27840"
  dashboard: "0.0.0.0:27850"
  completeness: archive
  residency: 2m
  archive_wait: 5s
