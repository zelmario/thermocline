# Thermocline configuration.
#
# The fast tier is a small cluster holding the working set. The cold tier is a
# big cheap cluster holding everything. When adopting on a running database,
# your existing cluster becomes the cold tier as it is.

hot:
  uri: "mongodb://rs-fast-1,rs-fast-2,rs-fast-3/?replicaSet=rsFast"

cold:
  uri: "mongodb://rs-cold-1,rs-cold-2,rs-cold-3/?replicaSet=rsCold"

log:
  # Where the daemons write. Leave empty for stderr, which is what you want
  # under systemd: journald captures the stream and rotation is not your
  # problem.
  #
  # Setting a path behaves like mongod's systemLog.path. The file receives
  # everything and the terminal receives nothing, so a one-shot
  # `cline evictor --once --dry-run` prints nothing to your screen.
  #
  # All four daemons read this one value, so they would share a file. Give each
  # its own with --log-file, which overrides this.
  #
  # Rotation is logrotate's job. Send SIGHUP after rotating and the daemon
  # reopens the file; without that it keeps writing to the renamed inode and
  # the file you are tailing stays empty while the disk fills.
  file: ""

# Where Thermocline keeps its own bookkeeping: watermarks, residency holds,
# checkpoints, the eviction and warming announcements and the unique key
# registry. Almost nobody sets this, and the default is right for a deployment
# that owns its pair of tiers.
#
# Set it when one pair of tiers carries two Thermocline deployments. They would
# otherwise share this database and each would read the other's watermarks,
# residency holds and singleton markers as its own. A feeder id already
# separates the checkpoints; this separates the rest.
#
# It must not name a database that also holds tiered collections. The feeder
# skips its own bookkeeping database wholesale, so that combination would stop
# those collections being mirrored with nothing saying so. The config refuses
# it rather than letting you find out at the first eviction.
meta:
  db: "_thermocline"

feeder:
  # Names this feeder's checkpoint. Changing it starts mirroring from now,
  # skipping everything written before, so only change it deliberately.
  id: "default"

  # Collections to mirror, as db.collection. Leave empty to mirror everything
  # except system databases and Thermocline's own bookkeeping.
  namespaces:
    - "app.orders"
    - "app.events"

  # How often the resume position is saved. Mirroring is idempotent, so this
  # trades repeated work after a restart against checkpoint writes.
  #
  # This used to set how long a read falling through to the archive waited, and
  # it should not: with checkpoint_every at 5s such a read took 4.5 seconds
  # against 1.8 ms for the query itself, because it was waiting for the next
  # checkpoint rather than for mirroring. Freshness now has its own setting
  # below and this one is back to meaning only what it says.
  checkpoint_every: 5s

  # How often the feeder publishes how far it has mirrored.
  #
  # A read the fast tier cannot answer goes to the archive, and the archive
  # trails the fast tier, so the router waits for mirroring to reach the instant
  # the read began before answering. This is how often it can find that out, so
  # it sets the floor on such a read's latency.
  #
  # The write is one small document with no resume token, at w:1, so several a
  # second cost nothing. Lower it if fallback reads matter; raise it if they are
  # rare and you would rather have the writes back. Zero turns it off and falls
  # back to the checkpoint, which is where this information used to live.
  position_every: 20ms

  # Documents per bulk write to the cold tier.
  batch_size: 500

  # How long a change stream poll blocks before returning empty. Also sets how
  # often an idle feeder flushes and checkpoints.
  #
  # On an idle database this is the floor under everything above. The feeder
  # only learns that time has passed with nothing written when the poll times
  # out and hands back an advanced resume token, so it cannot publish a position
  # newer than that, and a fallback read cannot beat it. Budget a fallback read
  # at roughly max_await + position_every.
  #
  # Lowering it costs one cheap getMore per interval against the fast tier and
  # nothing else. Measured on a read that falls through, with the router's own
  # side of the wait removed: 106ms at 100ms, 59ms at 50ms, 27ms at 20ms, 21ms
  # at 10ms, 17ms at 5ms, against a 4ms floor with the barrier off. A fallback
  # read costs about this interval plus seven milliseconds.
  #
  # Below 20ms it stops paying for itself: ten buys six milliseconds and makes
  # the tail worse. Lower it further only if fallback reads are on a user's path
  # and you would rather spend the round trips.
  max_await: 20ms

  # What to do with a delete on the fast tier that the evictor did not
  # announce. The evictor announces every document it removes, so an
  # unannounced delete came from the application.
  #
  #   tombstone  mark the archived copy as deleted, so reads stop returning it.
  #              Correct when the evictor is the only thing removing data.
  #   ignore     leave the archived copy readable. Choose this if you run bulk
  #              deletes outside the evictor and would rather keep the archive.
  #   halt       stop the feeder and alert rather than guess.
  unannounced_deletes: tombstone

evictor:
  # Must match feeder.id. The evictor reads mirroring lag from that feeder's
  # checkpoint and refuses to remove anything while it is behind.
  feeder_id: "default"

  # Documents removed per second, smoothed across the whole run. Start low and
  # raise it only after watching a full business day. This is the knob that
  # decides whether eviction is invisible or an incident.
  rate: 1000

  # Documents per pass. Each pass costs five round trips.
  batch_size: 500

  # Mirroring lag past which eviction stops. Removing a document the archive
  # has not received destroys it, so this check fails closed: if the lag cannot
  # be read at all, nothing is removed.
  max_feeder_lag: 30s

  rules:
    - ns: "app.orders"
      older_than: 90d
      # Leave date_field empty to read age from the timestamp inside a default
      # ObjectId _id. That needs no extra index and lets the scan follow the
      # _id index in order. Set it only if your _id is not a time-ordered
      # ObjectId, and then index {thatField: 1, _id: 1}.
      # date_field: "createdAt"

  # Live signals that pause eviction. Unlike max_feeder_lag these fail open: a
  # metric that moves in a future MongoDB release should not stop eviction
  # forever, since that would be its own outage.
  backoff:
    max_replication_lag: 10s
    max_cache_dirty: 0.05         # fraction of the WiredTiger cache
    # A fraction of the ticket pool, not a count. MongoDB 7.0 replaced the
    # fixed pool of 128 with one sized to the host, and a small container
    # reports a total of 8, so any absolute floor is unreachable there.
    min_write_tickets_free: 0.25
    min_oplog_window: 24h

warmer:
  # Documents copied up per second, smoothed across the whole run.
  rate: 2000

  # Documents per pass. These carry whole documents, unlike the evictor's
  # batches of ids, so keep it smaller.
  batch_size: 200

  # How long a warmed document is protected from the evictor. Without this, a
  # warm followed by an eviction sweep undoes itself.
  residency: 30d

  rules:
    - ns: "app.orders"
      # Fill the fast tier back this far. This is what moves the completeness
      # watermark, which is what lets a range query be answered from the fast
      # tier alone instead of falling through to the archive.
      back: 90d
      # date_field: "createdAt"   # same convention as the evictor

  backoff:
    max_replication_lag: 10s
    max_cache_dirty: 0.05
    min_write_tickets_free: 0.25
    min_oplog_window: 24h

router:
  # The address clients connect to. In production this takes over the name the
  # application already dials, by repointing DNS, so nothing in the application
  # changes.
  listen: "0.0.0.0:27017"

  # What to do with a query whose answer the fast tier cannot guarantee is
  # whole, meaning it reaches earlier than the completeness watermark.
  #
  #   archive     run the whole query against the archive instead. It holds
  #               every document, so the caller gets a correct answer and
  #               nothing in the application changes. The cost is that the
  #               query runs at archive speed, and that the archive trails the
  #               fast tier by the feeder's mirroring lag, so such a read is as
  #               fresh as a secondary read rather than perfectly current.
  #   strict      refuse it. Correct and loud, but a refused countDocuments is
  #               a broken application. Choose this when you would rather find
  #               out immediately than run slowly.
  #   permissive  answer from the fast tier anyway and count it. This returns
  #               short results and calls them success.
  completeness: archive

  # How long a copied-up document is protected from the evictor.
  residency: 30d

  # The operator dashboard: one page showing what each tier is holding, how
  # commands were served, and what each kind of command cost. Empty means off.
  #
  # Keep it off the address the application dials. The page names collections
  # and reports traffic, and it has no authentication of its own, so it belongs
  # on an operator network or behind whatever already fronts your internal
  # tooling.
  #
  # dashboard: "127.0.0.1:27101"

  # The learned cache.
  #
  # The router records the shape of every read, a hash of its parameters and a
  # hash of its result, and works out how long each query's answer stays the
  # same. `cline cache` prints what it found and what TTL that justifies, ten
  # per cent inside the observed stability. That measuring always happens; this
  # switch is only about whether the answers are then served from memory.
  #
  # Turn it on against the report rather than in hope. A write through the
  # router drops what it learned about that collection, so the writer never
  # reads its own stale answer; a writer that does not come through the router
  # is bounded by the learned TTL and by max_ttl.
  # cache:
  #   enabled: false
  #   max_queries: 1000
  #   # How much memory the held answers may occupy. Counting queries is not a
  #   # bound: a thousand replies of a megabyte each is a gigabyte. A single
  #   # answer larger than 256 KB is learned from but never held.
  #   max_bytes: 67108864
  #   max_ttl: 1m
  #   # The measuring is a switch of its own, because it is not free: a hash of
  #   # every reply and a bounded table of query shapes. On by default, so the
  #   # report is there when you go looking; set it to false to have neither
  #   # half.
  #   measure: true

  # The operator dashboard is off unless router.dashboard names an address, and
  # turning it off costs nothing else: the page and its snapshot are only built
  # when something asks for them.

  # TLS for the clients that connect here.
  #
  # This takes over an address the application already dials, so whatever that
  # connection was has to keep working: a driver told tls=true insists on it and
  # will not connect to a plaintext proxy at all. cert and key are the router's
  # own, in PEM, and it is both or neither.
  #
  # ca is the authority client certificates are checked against, and setting it
  # is what makes client certificates possible at all. require_client_cert then
  # refuses a client that presents none, which needs ca to check against.
  #
  # Whether the fast tier itself requires TLS is not configured here. It is read
  # from hot.uri, where the driver already needs it written, so the two cannot
  # drift apart: tls=true, tlsCAFile and tlsInsecure are all honoured for the
  # raw connection this proxies bytes over as well as for the driver's own.
  # tls:
  #   cert: "/etc/thermocline/router.pem"
  #   key: "/etc/thermocline/router-key.pem"
  #   ca: "/etc/thermocline/ca.pem"
  #   require_client_cert: false
