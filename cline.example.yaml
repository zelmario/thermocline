# Thermocline configuration.
#
# The fast tier is a small cluster holding the working set. The cold tier is a
# big cheap cluster holding everything. When adopting on a running database,
# your existing cluster becomes the cold tier as it is.

hot:
  uri: "mongodb://rs-fast-1,rs-fast-2,rs-fast-3/?replicaSet=rsFast"

cold:
  uri: "mongodb://rs-cold-1,rs-cold-2,rs-cold-3/?replicaSet=rsCold"

log:
  # Where the daemons write. Leave empty for stderr, which is what you want
  # under systemd: journald captures the stream and rotation is not your
  # problem.
  #
  # Setting a path behaves like mongod's systemLog.path. The file receives
  # everything and the terminal receives nothing, so a one-shot
  # `cline evictor --once --dry-run` prints nothing to your screen.
  #
  # All four daemons read this one value, so they would share a file. Give each
  # its own with --log-file, which overrides this.
  #
  # Rotation is logrotate's job. Send SIGHUP after rotating and the daemon
  # reopens the file; without that it keeps writing to the renamed inode and
  # the file you are tailing stays empty while the disk fills.
  file: ""

feeder:
  # Names this feeder's checkpoint. Changing it starts mirroring from now,
  # skipping everything written before, so only change it deliberately.
  id: "default"

  # Collections to mirror, as db.collection. Leave empty to mirror everything
  # except system databases and Thermocline's own bookkeeping.
  namespaces:
    - "app.orders"
    - "app.events"

  # How often the resume position is saved. Mirroring is idempotent, so this
  # trades repeated work after a restart against checkpoint writes.
  checkpoint_every: 5s

  # Documents per bulk write to the cold tier.
  batch_size: 500

  # How long a change stream poll blocks before returning empty. Also sets how
  # often an idle feeder flushes and checkpoints.
  max_await: 1s

  # What to do with a delete on the fast tier that the evictor did not
  # announce. The evictor announces every document it removes, so an
  # unannounced delete came from the application.
  #
  #   tombstone  mark the archived copy as deleted, so reads stop returning it.
  #              Correct when the evictor is the only thing removing data.
  #   ignore     leave the archived copy readable. Choose this if you run bulk
  #              deletes outside the evictor and would rather keep the archive.
  #   halt       stop the feeder and alert rather than guess.
  unannounced_deletes: tombstone

evictor:
  # Must match feeder.id. The evictor reads mirroring lag from that feeder's
  # checkpoint and refuses to remove anything while it is behind.
  feeder_id: "default"

  # Documents removed per second, smoothed across the whole run. Start low and
  # raise it only after watching a full business day. This is the knob that
  # decides whether eviction is invisible or an incident.
  rate: 1000

  # Documents per pass. Each pass costs five round trips.
  batch_size: 500

  # Mirroring lag past which eviction stops. Removing a document the archive
  # has not received destroys it, so this check fails closed: if the lag cannot
  # be read at all, nothing is removed.
  max_feeder_lag: 30s

  rules:
    - ns: "app.orders"
      older_than: 90d
      # Leave date_field empty to read age from the timestamp inside a default
      # ObjectId _id. That needs no extra index and lets the scan follow the
      # _id index in order. Set it only if your _id is not a time-ordered
      # ObjectId, and then index {thatField: 1, _id: 1}.
      # date_field: "createdAt"

  # Live signals that pause eviction. Unlike max_feeder_lag these fail open: a
  # metric that moves in a future MongoDB release should not stop eviction
  # forever, since that would be its own outage.
  backoff:
    max_replication_lag: 10s
    max_cache_dirty: 0.05         # fraction of the WiredTiger cache
    # A fraction of the ticket pool, not a count. MongoDB 7.0 replaced the
    # fixed pool of 128 with one sized to the host, and a small container
    # reports a total of 8, so any absolute floor is unreachable there.
    min_write_tickets_free: 0.25
    min_oplog_window: 24h

warmer:
  # Documents copied up per second, smoothed across the whole run.
  rate: 2000

  # Documents per pass. These carry whole documents, unlike the evictor's
  # batches of ids, so keep it smaller.
  batch_size: 200

  # How long a warmed document is protected from the evictor. Without this, a
  # warm followed by an eviction sweep undoes itself.
  residency: 30d

  rules:
    - ns: "app.orders"
      # Fill the fast tier back this far. This is what moves the completeness
      # watermark, which is what lets a range query be answered from the fast
      # tier alone instead of falling through to the archive.
      back: 90d
      # date_field: "createdAt"   # same convention as the evictor

  backoff:
    max_replication_lag: 10s
    max_cache_dirty: 0.05
    min_write_tickets_free: 0.25
    min_oplog_window: 24h

router:
  # The address clients connect to. In production this takes over the name the
  # application already dials, by repointing DNS, so nothing in the application
  # changes.
  listen: "0.0.0.0:27017"

  # What to do with a query whose answer the fast tier cannot guarantee is
  # whole, meaning it reaches earlier than the completeness watermark.
  #
  #   archive     run the whole query against the archive instead. It holds
  #               every document, so the caller gets a correct answer and
  #               nothing in the application changes. The cost is that the
  #               query runs at archive speed, and that the archive trails the
  #               fast tier by the feeder's mirroring lag, so such a read is as
  #               fresh as a secondary read rather than perfectly current.
  #   strict      refuse it. Correct and loud, but a refused countDocuments is
  #               a broken application. Choose this when you would rather find
  #               out immediately than run slowly.
  #   permissive  answer from the fast tier anyway and count it. This returns
  #               short results and calls them success.
  completeness: archive

  # How long a copied-up document is protected from the evictor.
  residency: 30d
